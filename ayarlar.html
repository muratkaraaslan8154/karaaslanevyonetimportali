<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Paneli - KARAASLAN Portalı</title>
    
    <script>
        // --- SİSTEM YÖNETİCİSİ AYARI ---
        // Sistemi yönetecek ve silinemeyecek ana hesabın adını buraya yazın (Küçük harfle)
        const ADMIN_KULLANICI = "murat"; 

        // OTURUM KONTROLÜ
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.replace('giris.html');
        }
        
        // YETKİ KONTROLÜ (Giren kişi Admin değilse kov)
        if (localStorage.getItem('currentUser') !== ADMIN_KULLANICI) {
            alert("Yetkisiz Erişim! Ayarlar sayfasına sadece sistem yöneticisi girebilir.");
            window.location.replace('index.html');
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f9; padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { border-bottom: 2px solid #805ad5; padding-bottom: 10px; color: #2d3748; margin-top: 0; display: flex; justify-content: space-between; align-items: center;}
        
        /* Form Alanları */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; color: #4a5568;}
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;}
        .btn-save { background: #805ad5; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s;}
        .btn-save:hover { background: #6b46c1; }
        
        /* Kullanıcı Tablosu */
        table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
        th { background-color: #f7fafc; color: #4a5568; }
        
        .btn-delete { background: #e53e3e; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-edit { background: #3182ce; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-right: 5px; }
        
        .btn-back { display: block; text-align: center; margin-top: 25px; color: #718096; text-decoration: none; font-weight: 500;}
    </style>
</head>
<body>
    <div class="container">
        <h2>
            ⚙️ Sistem Yönetimi
            <span style="font-size: 0.9rem; font-weight: normal; color: #a0aec0;" id="adminLabel"></span>
        </h2>
        
        <div style="background: #f7fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="margin-top: 0; font-size: 1.1rem; color: #2d3748;" id="formTitle">Yeni Kullanıcı Ekle</h3>
            <div class="form-group">
                <label>Kullanıcı Adı (Küçük Harf):</label>
                <input type="text" id="newUsername" placeholder="Örn: mert" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Giriş PIN Kodu:</label>
                <input type="text" id="newPin" placeholder="Örn: 1234" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Cihaz Kısıtlaması:</label>
                <select id="deviceSelect">
                    <option value="all">Tüm Cihazlar</option>
                    <option value="mobile">Sadece Cep Telefonu</option>
                    <option value="pc">Sadece Bilgisayar</option>
                </select>
            </div>
            <div class="form-group">
                <label>Konum Kısıtlaması:</label>
                <select id="locationSelect">
                    <option value="false">Konum Fark Etmez</option>
                    <option value="true">Sadece Evdeyken Girebilir</option>
                </select>
            </div>
            <button class="btn-save" id="saveBtn" onclick="kullaniciKaydet()">Kullanıcıyı Kaydet</button>
            <button class="btn-save" id="cancelBtn" onclick="formuTemizle()" style="display:none; background: #a0aec0;">İptal Et</button>
        </div>

        <h3 style="font-size: 1.1rem; color: #2d3748; margin-bottom: 10px;">Mevcut Kullanıcılar</h3>
        <table>
            <thead>
                <tr>
                    <th>Kullanıcı</th>
                    <th>PIN</th>
                    <th>Cihaz</th>
                    <th>Ev Şartı</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- Kullanıcılar buraya JS ile yüklenecek -->
            </tbody>
        </table>

        <a href="index.html" class="btn-back">← Ana Menüye Dön</a>
    </div>

    <script>
        // Sayfa başlığına adminin adını yazdır
        document.getElementById('adminLabel').innerText = "Admin: " + ADMIN_KULLANICI.toUpperCase();

        // Veritabanını çağır
        let usersDB = JSON.parse(localStorage.getItem('usersDB')) || {};

        function listeyiGuncelle() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = "";

            for (const [username, details] of Object.entries(usersDB)) {
                let deviceText = details.device === "all" ? "Tümü" : (details.device === "mobile" ? "Mobil" : "PC");
                let locText = details.requireLocation ? "Evet" : "Hayır";
                
                // Yönetici hesabının silinmesini engelle (Değişken üzerinden kontrol edilir)
                let actionButtons = username === ADMIN_KULLANICI 
                    ? `<button class="btn-edit" onclick="kullaniciDuzenle('${username}')">Düzenle</button>` 
                    : `<button class="btn-edit" onclick="kullaniciDuzenle('${username}')">Düzenle</button>
                       <button class="btn-delete" onclick="kullaniciSil('${username}')">Sil</button>`;

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:bold;">${username}</td>
                        <td>${details.pin}</td>
                        <td>${deviceText}</td>
                        <td>${locText}</td>
                        <td>${actionButtons}</td>
                    </tr>
                `;
            }
        }

        function kullaniciKaydet() {
            const user = document.getElementById('newUsername').value.toLowerCase().trim();
            const pin = document.getElementById('newPin').value.trim();
            
            if(!user || !pin) {
                alert("Lütfen kullanıcı adı ve PIN girin!");
                return;
            }

            usersDB[user] = {
                pin: pin,
                device: document.getElementById('deviceSelect').value,
                requireLocation: document.getElementById('locationSelect').value === "true"
            };

            // Değişiklikleri kaydet ve tabloyu yenile
            localStorage.setItem('usersDB', JSON.stringify(usersDB));
            formuTemizle();
            listeyiGuncelle();
        }

        function kullaniciSil(username) {
            if(confirm(username + " adlı kullanıcıyı silmek istediğinize emin misiniz?")) {
                delete usersDB[username];
                localStorage.setItem('usersDB', JSON.stringify(usersDB));
                listeyiGuncelle();
            }
        }

        function kullaniciDuzenle(username) {
            const data = usersDB[username];
            document.getElementById('newUsername').value = username;
            document.getElementById('newUsername').disabled = true; // Adı değiştirmesin
            document.getElementById('newPin').value = data.pin;
            document.getElementById('deviceSelect').value = data.device;
            document.getElementById('locationSelect').value = data.requireLocation.toString();
            
            document.getElementById('formTitle').innerText = "Kullanıcıyı Düzenle: " + username;
            document.getElementById('saveBtn').innerText = "Güncelle";
            document.getElementById('cancelBtn').style.display = "block";
        }

        function formuTemizle() {
            document.getElementById('newUsername').value = "";
            document.getElementById('newUsername').disabled = false;
            document.getElementById('newPin').value = "";
            document.getElementById('deviceSelect').value = "all";
            document.getElementById('locationSelect').value = "false";
            
            document.getElementById('formTitle').innerText = "Yeni Kullanıcı Ekle";
            document.getElementById('saveBtn').innerText = "Kullanıcıyı Kaydet";
            document.getElementById('cancelBtn').style.display = "none";
        }

        // Sayfa açıldığında tabloyu doldur
        listeyiGuncelle();
    </script>
</body>
</html>
