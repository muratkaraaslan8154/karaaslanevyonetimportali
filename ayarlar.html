<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Paneli - KARAASLAN Portalı</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const activeUser = (localStorage.getItem('currentUser') || '').toLowerCase();
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

        if (!isLoggedIn) {
            window.location.replace('giris.html');
        }
        
        if (activeUser !== 'murat' && activeUser !== 'admin') {
            alert("Yetkisiz Erişim! Ayarlar sayfasına sadece 'murat' ve 'admin' erişabilir.");
            window.location.replace('index.html');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyD1hbPbA81qldXCsQxSM4Ozxr9L8sdRTMk",
            authDomain: "karaaslanhomebutcetakip.firebaseapp.com",
            databaseURL: "https://karaaslanhomebutcetakip-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "karaaslanhomebutcetakip",
            storageBucket: "karaaslanhomebutcetakip.firebasestorage.app",
            messagingSenderId: "566343253682",
            appId: "1:566343253682:web:3ab14198fca800d69813ab"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('usersDB/' + activeUser).on('value', (snapshot) => {
            const userData = snapshot.val();
            if (userData && userData.isBlocked === true) {
                alert("🚫 Hesabınız yönetici tarafından bloke edilmiştir! Oturum kapatılıyor.");
                localStorage.clear();
                sessionStorage.clear();
                window.location.replace('giris.html');
            }
        });
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body { font-family: 'Roboto', sans-serif; background-color: #f4f6f9; padding: 1.5rem 1rem; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 950px; background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { border-bottom: 2px solid #805ad5; padding-bottom: 10px; color: #2d3748; margin-top: 0; display: flex; justify-content: space-between; align-items: center;}
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; color: #4a5568;}
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box;}
        .btn-save { background: #805ad5; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
        th { background-color: #f7fafc; color: #4a5568; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; }
        .badge-blocked { background: #fed7d7; color: #9b2c2c; }
        .badge-active { background: #c6f6d5; color: #22543d; }

        .btn-unblock { background: #38a169; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-block { background: #e53e3e; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #718096; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        
        .btn-back { display: block; text-align: center; margin-top: 25px; color: #718096; text-decoration: none; font-weight: 500;}
        .log-box { max-height: 350px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px; }
        
        .gps-link { color: #3182ce; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 3px; }
        .gps-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>
            ⚙️ Sistem Yönetimi
            <span style="font-size: 0.9rem; font-weight: normal; color: #805ad5;" id="adminLabel"></span>
        </h2>
        
        <div style="background: #f7fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <h3 style="margin-top: 0; font-size: 1.1rem; color: #2d3748;" id="formTitle">Yeni Kullanıcı Ekle</h3>
            <div class="form-group">
                <label>Kullanıcı Adı (Küçük Harf):</label>
                <input type="text" id="newUsername" placeholder="Örn: mert" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Giriş PIN Kodu:</label>
                <input type="text" id="newPin" placeholder="Örn: 1234" autocomplete="off">
            </div>
            <button class="btn-save" id="saveBtn" onclick="kullaniciKaydet()">Kullanıcıyı Kaydet</button>
            <button class="btn-save" id="cancelBtn" onclick="formuTemizle()" style="display:none; background: #a0aec0;">İptal Et</button>
        </div>

        <h3 style="font-size: 1.1rem; color: #2d3748; margin-bottom: 10px;">👥 Kullanıcılar & Cihaz Güvenliği</h3>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Kullanıcı</th>
                        <th>PIN</th>
                        <th>Cihaz Bilgileri</th>
                        <th>Birikim Modülü</th>
                        <th>Durum</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>

        <h3 style="font-size: 1.1rem; color: #2d3748; margin-top: 30px; margin-bottom: 10px;">📋 Giriş / Çıkış, IP & Lokasyon Logları</h3>
        <div class="log-box" style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Tarih / Saat</th>
                        <th>Kullanıcı</th>
                        <th>İşlem</th>
                        <th>IP / Şehir</th>
                        <th>GPS Konumu</th>
                        <th>Cihaz <span style="font-size: 0.7rem; font-weight:normal;">(Kopyalamak için tıkla)</span></th>
                    </tr>
                </thead>
                <tbody id="logTableBody"></tbody>
            </table>
        </div>

        <a href="index.html" class="btn-back">← Ana Menüye Dön</a>
    </div>

    <script>
        document.getElementById('adminLabel').innerText = "Yetkili: " + activeUser.toUpperCase();

        let usersDB = {};
        let savingsVis = {};

        // Kullanıcılar ve Birikim Görünürlük Verisini Çek
        db.ref('usersDB').on('value', (snapshot) => {
            usersDB = snapshot.val() || {};
            db.ref('savingsVisibility').on('value', (visSnap) => {
                savingsVis = visSnap.val() || {};
                kullaniciListesiniGuncelle();
            });
        });

        db.ref('systemLogs').orderByChild('timestamp').limitToLast(50).on('value', (snapshot) => {
            const logsObj = snapshot.val() || {};
            const logArray = Object.values(logsObj).reverse();
            logListesiniGuncelle(logArray);
        });

        async function toggleSavingsVis(user, state) {
            await db.ref('savingsVisibility/' + user).set(state);
        }

        function kullaniciListesiniGuncelle() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = "";

            for (const [username, details] of Object.entries(usersDB)) {
                const isBlocked = details.isBlocked || false;
                const isExempt = (username === 'murat' || username === 'admin');

                // Ana Cihaz ve Ek İzinli Cihazları Listeleyen Bölüm
                let regDeviceTxt = details.registeredDevice ? details.registeredDevice.substring(0, 15) + "..." : "Henüz Yok";
                let deviceCellHTML = `<div><strong style="color: #4a5568;">Ana:</strong> ${regDeviceTxt}</div>`;
                
                if (details.safeDevices) {
                    deviceCellHTML += `<div style="margin-top: 6px; font-size: 0.8rem; color: #3182ce;">
                                        <strong>İzinli Ek Cihazlar:</strong>
                                        <ul style="margin: 2px 0; padding-left: 15px; color: #2d3748;">`;
                    for (const [devId, not] of Object.entries(details.safeDevices)) {
                        deviceCellHTML += `<li style="margin-bottom:3px;" title="${devId}">
                                              ${not} 
                                              <span style="color:#e53e3e; cursor:pointer; font-weight:bold; margin-left: 5px; background:#fed7d7; padding:0 4px; border-radius:3px;" onclick="cihazSil('${username}', '${devId}')" title="Bu cihazı sil">✖</span>
                                           </li>`;
                    }
                    deviceCellHTML += `</ul></div>`;
                }

                let statusBadge = isBlocked 
                    ? `<span class="badge badge-blocked">BLOKELİ</span>` 
                    : `<span class="badge badge-active">AKTİF</span>`;

                let actionBtns = '';
                
                if (isBlocked) {
                    actionBtns += `<button class="btn-unblock" onclick="blokeKaldir('${username}')">Bloke Kaldır</button> `;
                } else if (!isExempt) {
                    actionBtns += `<button class="btn-block" onclick="blokeEt('${username}')">Bloke Et</button> `;
                }

                if (!isExempt) {
                    actionBtns += `<button class="btn-delete" onclick="kullaniciSil('${username}')">Sil</button>`;
                    actionBtns += `<br><button class="btn-save" style="padding: 5px 10px; margin-top: 8px; width: auto; background: #3182ce; font-size:0.8rem;" onclick="cihazEkle('${username}')">📱 Ek Cihaz İzni Ver</button>`;
                }

                // Birikim görünürlük kontrolü
                let birikimErisimi = '';
                if (username !== 'admin') {
                    const isChecked = savingsVis[username] ? 'checked' : '';
                    birikimErisimi = `<input type="checkbox" onchange="toggleSavingsVis('${username}', this.checked)" ${isChecked} style="width:auto; cursor:pointer;"> Aktif`;
                } else {
                    birikimErisimi = `<span style="color: #a0aec0; font-size: 0.8rem;">Yönetici</span>`;
                }

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:bold;">${username} ${isExempt ? '🛡️' : ''}</td>
                        <td>${details.pin}</td>
                        <td>${deviceCellHTML}</td>
                        <td>${birikimErisimi}</td>
                        <td>${statusBadge}</td>
                        <td>${actionBtns}</td>
                    </tr>
                `;
            }
        }

        // YENİ: Cihaz Ekleme Fonksiyonu
        async function cihazEkle(username) {
            const cihazId = prompt(`${username} kullanıcısı için Güvenli Cihaz Kimliğini (ID) girin:\n\n(İpucu: Sayfanın altındaki loglarda cihaz isimlerine tıklayarak kopyalayabilirsiniz.)`);
            if (!cihazId || cihazId.trim() === "") return;
            
            // Firebase anahtarlarında nokta veya köşeli parantez kullanılamayacağı için temizliyoruz
            const cleanId = cihazId.trim().replace(/[.#$\[\]]/g, '_'); 
            
            const cihazNotu = prompt("Bu cihazı sonradan hatırlamak için bir not girin:\nÖrn: Eşimin Tableti, Salondaki PC, Mert'in Telefonu");
            if (!cihazNotu || cihazNotu.trim() === "") return;

            await db.ref(`usersDB/${username}/safeDevices/${cleanId}`).set(cihazNotu.trim());
            await sistemLogYaz(activeUser, `Ek Cihaz İzni Eklendi (${username}): ${cihazNotu}`);
        }

        // YENİ: Cihaz Silme Fonksiyonu
        async function cihazSil(username, devId) {
            if(confirm("Bu cihazın sisteme giriş iznini iptal etmek istediğinize emin misiniz?")) {
                await db.ref(`usersDB/${username}/safeDevices/${devId}`).remove();
                await sistemLogYaz(activeUser, `Cihaz İzni Kaldırıldı (${username})`);
            }
        }

        function kopyala(metin) {
            navigator.clipboard.writeText(metin).then(() => {
                alert("Cihaz ID kopyalandı:\n" + metin);
            });
        }

        function logListesiniGuncelle(logs) {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = "";

            logs.forEach(log => {
                let rowColor = (log.action && (log.action.includes('🚫') || log.action.includes('Blokeli'))) ? 'background:#fff5f5;' : '';
                const ipLocation = (log.ip ? log.ip : 'Bilinmiyor') + (log.location ? ` (${log.location})` : '');
                let gpsDisplay = '<span style="color:#a0aec0;">Yok</span>';
                if (log.gpsLat && log.gpsLng) {
                    gpsDisplay = `<a href="https://maps.google.com/?q=${log.gpsLat},${log.gpsLng}" target="_blank" class="gps-link">📍 Haritada Gör</a>`;
                }

                // Cihaz metnine tıklandığında kopyalama eklendi
                let deviceText = log.device || '-';
                let shortDeviceText = log.device ? log.device.substring(0, 20) + '...' : '-';

                tbody.innerHTML += `
                    <tr style="${rowColor}">
                        <td>${log.time || '-'}</td>
                        <td style="font-weight:bold;">${log.user || '-'}</td>
                        <td>${log.action || '-'}</td>
                        <td style="font-size:0.8rem; color:#2d3748;">${ipLocation}</td>
                        <td>${gpsDisplay}</td>
                        <td style="font-size:0.75rem; color:#3182ce; cursor:pointer; text-decoration:underline;" onclick="kopyala('${deviceText}')" title="Kopyalamak için tıkla">${shortDeviceText}</td>
                    </tr>
                `;
            });
        }

        async function getIpAndLocation() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                return {
                    ip: data.ip || 'Bilinmiyor',
                    location: (data.city && data.country_name) ? `${data.city}, ${data.country_name}` : 'Bilinmiyor'
                };
            } catch (err) { return { ip: 'Bilinmiyor', location: 'Bilinmiyor' }; }
        }

        function getGPSCoordinates() {
            return new Promise((resolve) => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
                        () => resolve(null), { timeout: 4000 }
                    );
                } else { resolve(null); }
            });
        }

        async function sistemLogYaz(user, action) {
            const ipData = await getIpAndLocation();
            const gpsData = await getGPSCoordinates();
            const now = new Date();
            const timeStr = `${now.toLocaleDateString('tr-TR')} ${now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})}`;

            db.ref('systemLogs').push({
                user: user, action: action, device: navigator.userAgent,
                ip: ipData.ip, location: ipData.location, gpsLat: gpsData ? gpsData.lat : null,
                gpsLng: gpsData ? gpsData.lng : null, time: timeStr, timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        async function kullaniciKaydet() {
            const user = document.getElementById('newUsername').value.toLowerCase().trim();
            const pin = document.getElementById('newPin').value.trim();
            if(!user || !pin) return alert("Lütfen kullanıcı adı ve PIN girin!");

            await db.ref('usersDB/' + user).update({ pin: pin, isBlocked: false });
            await db.ref('savingsVisibility/' + user).set(true); // Eklendiğinde varsayılan birikim modülü aktif

            await sistemLogYaz(activeUser, `Yeni Kullanıcı Eklendi: ${user}`);
            alert("Kullanıcı başarıyla kaydedildi!");
            formuTemizle();
        }

        async function blokeKaldir(username) {
            if(confirm(username + " kullanıcısının blokesini kaldırmak ve ana cihazını sıfırlamak istiyor musunuz?")) {
                await db.ref('usersDB/' + username).update({ isBlocked: false, registeredDevice: null });
                await sistemLogYaz(activeUser, `Bloke Kaldırıldı & Cihaz Sıfırlandı: ${username}`);
            }
        }
        async function blokeEt(username) {
            if(confirm(username + " kullanıcısını bloke etmek istediğinizden emin misiniz?")) {
                await db.ref('usersDB/' + username).update({ isBlocked: true });
                await sistemLogYaz(activeUser, `🚫 Kullanıcı Bloke Edildi: ${username}`);
            }
        }
        async function kullaniciSil(username) {
            if(confirm(username + " adlı kullanıcıyı silmek istediğinize emin misiniz?")) {
                await db.ref('usersDB/' + username).remove();
                await db.ref('savingsVisibility/' + username).remove();
                await sistemLogYaz(activeUser, `Kullanıcı Silindi: ${username}`);
            }
        }

        function formuTemizle() {
            document.getElementById('newUsername').value = ""; document.getElementById('newPin').value = "";
        }
    </script>
</body>
</html>
