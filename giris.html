<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - KARAASLAN Portalı</title>

    <!-- OTURUM KONTROLÜ -->
    <script>
        if (localStorage.getItem('isLoggedIn') === 'true') {
            const savedUser = localStorage.getItem('currentUser') || '';
            window.location.replace(`index.html?user=${encodeURIComponent(savedUser)}`);
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 340px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 15px; }
        #status { font-size: 0.9rem; margin-top: 15px; font-weight: bold; color: #e74c3c; line-height: 1.4; }
        
        .pin-container { position: relative; width: 100%; margin: 8px 0 15px; }
        .pin-container input { margin: 0; padding-right: 40px; }
        .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.1rem; user-select: none; color: #718096; }
        
        /* YENİ: Cihaz ID Gösterim Stili */
        .dev-id-display { font-size: 0.75rem; color: #a0aec0; margin-top: 25px; cursor: pointer; word-break: break-all; border-top: 1px solid #e2e8f0; padding-top: 10px; }
        .dev-id-display:hover { color: #3182ce; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 Giriş Yap</h2>
        <input type="text" id="username" placeholder="Kullanıcı Adı" autocomplete="off">
        
        <div class="pin-container">
            <input type="password" id="pin" placeholder="PIN Kodu" autocomplete="off">
            <span class="toggle-password" onclick="togglePin()" title="Şifreyi Göster/Gizle">👁️</span>
        </div>

        <button onclick="login()">Giriş</button>
        <div id="status"></div>
        
        <!-- YENİ: Cihaz ID'sini ekranda gösteriyoruz -->
        <div id="devIdDisplay" class="dev-id-display" onclick="kopyalaDevId()" title="Kopyalamak için tıklayın">
            Cihaz ID Yükleniyor...
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD1hbPbA81qldXCsQxSM4Ozxr9L8sdRTMk",
            authDomain: "karaaslanhomebutcetakip.firebaseapp.com",
            databaseURL: "https://karaaslanhomebutcetakip-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "karaaslanhomebutcetakip",
            storageBucket: "karaaslanhomebutcetakip.firebasestorage.app",
            messagingSenderId: "566343253682",
            appId: "1:566343253682:web:3ab14198fca800d69813ab"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('username').addEventListener('keypress', function(e) { if (e.key === 'Enter') login(); });
        document.getElementById('pin').addEventListener('keypress', function(e) { if (e.key === 'Enter') login(); });
        
        function togglePin() {
            const pinInput = document.getElementById('pin');
            pinInput.type = pinInput.type === 'password' ? 'text' : 'password';
        }

        // Benzersiz Cihaz Kimliği Oluşturma / Okuma
        function getDeviceId() {
            let devId = localStorage.getItem('app_device_id');
            if (!devId) {
                devId = 'DEV_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
                localStorage.setItem('app_device_id', devId);
            }
            return devId;
        }

        // Sayfa yüklendiğinde Cihaz ID'yi göster
        const currentDeviceId = getDeviceId();
        document.getElementById('devIdDisplay').innerHTML = `📱 Cihaz ID:<br><b>${currentDeviceId}</b>`;

        function kopyalaDevId() {
            navigator.clipboard.writeText(currentDeviceId).then(() => {
                alert("Cihaz ID kopyalandı:\n" + currentDeviceId + "\n\nŞimdi bunu ayarlar sayfasından Ek Cihaz olarak ekleyebilirsiniz.");
            });
        }

        // Log Kaydetme Fonksiyonu
        async function createLog(user, action, details) {
            const now = new Date();
            const timeStr = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR');
            await db.ref('systemLogs').push({
                user: user,
                action: action,
                time: timeStr,
                device: details,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        async function login() {
            const user = document.getElementById('username').value.toLowerCase().trim();
            const pin = document.getElementById('pin').value.trim();
            const status = document.getElementById('status');

            if (!user || !pin) {
                status.innerText = "Lütfen tüm alanları doldurun!";
                return;
            }

            status.style.color = "#3498db";
            status.innerText = "Kontrol ediliyor...";

            try {
                const snapshot = await db.ref('usersDB').once('value');
                const users = snapshot.val() || {};
                const isExempt = (user === 'murat' || user === 'admin');

                if (!users[user] || users[user].pin !== pin) {
                    status.style.color = "#e74c3c";
                    status.innerText = "Kullanıcı adı veya PIN hatalı!";
                    await createLog(user || 'Bilinmeyen', "Hatalı Giriş Denemesi", currentDeviceId);
                    return;
                }

                const userData = users[user];

                // 1. Bloke Kontrolü
                if (userData.isBlocked) {
                    status.style.color = "#e74c3c";
                    status.innerHTML = `⛔ Hesabınız bloke edilmiştir!<br>Mevcut Cihaz: <b>${currentDeviceId}</b>`;
                    await createLog(user, "Blokeli Hesap Giriş Denemesi", currentDeviceId);
                    return;
                }

                // 2. Gelişmiş Çoklu Cihaz Güvenlik Kontrolü
                if (!isExempt) {
                    const isMainDevice = (userData.registeredDevice === currentDeviceId);
                    const isSafeDevice = (userData.safeDevices && userData.safeDevices[currentDeviceId]);

                    if (!userData.registeredDevice && !isSafeDevice) {
                        // İlk Giriş Yapılan Cihazı Ana Cihaz Olarak Kaydet
                        await db.ref('usersDB/' + user).update({ registeredDevice: currentDeviceId });
                    } else if (!isMainDevice && !isSafeDevice) {
                        // Farklı / İzinsiz Cihaz Tespiti -> Otomatik Bloke Et
                        await db.ref('usersDB/' + user).update({ isBlocked: true });
                        await createLog(user, "🚫 İZİNSİZ CİHAZ! Hesap Otomatik Bloke Edildi", currentDeviceId);
                        
                        status.style.color = "#e74c3c";
                        status.innerHTML = `⛔ İzinsiz cihaz algılandı!<br>Sisteme girmeye çalıştığınız cihazın ID'si:<br><b>${currentDeviceId}</b><br><br>Yöneticinize ileterek izin isteyin.`;
                        return;
                    }
                }

                // Başarılı Giriş
                await createLog(user, "Giriş Yapıldı", currentDeviceId);
                grantAccess(user);

            } catch (err) {
                console.error(err);
                status.innerText = "Bağlantı hatası!";
            }
        }

        function grantAccess(username) {
            const status = document.getElementById('status');
            status.style.color = "#27ae60";
            status.innerText = "Giriş Başarılı!";

            localStorage.setItem('currentUser', username);
            localStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('currentUser', username);
            sessionStorage.setItem('isLoggedIn', 'true');
            document.cookie = "currentUser=" + username + "; path=/; max-age=31536000";

            setTimeout(() => {
                window.location.href = `index.html?user=${encodeURIComponent(username)}`;
            }, 500);
        }
    </script>
</body>
</html>
