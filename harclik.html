<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harçlık Yönetim & 12 Aylık Ortalama Takip Sistemi</title>

    <!-- OTURUM KONTROLÜ -->
    <script>
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.replace('giris.html');
        }
    </script>

    <!-- FIREBASE KÜTÜPHANELERİ -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --whatsapp: #25d366;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px;
        }

        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .db-status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }
        .db-online { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; }
        .db-offline { background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--text);
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
        }

        .form-group input, .form-group select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .checkbox-group label {
            font-size: 0.8rem;
            background: #f1f5f9;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .update-option {
            grid-column: 1 / -1;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 10px 14px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #166534;
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #64748b; color: white; text-decoration: none; }
        .btn-pay { background: var(--primary); color: white; padding: 6px 10px; font-size: 0.8rem; }
        .btn-paid-cancel { background: #fee2e2; color: #b91c1c; padding: 6px 10px; font-size: 0.8rem; }
        .btn-wa { background: #dcfce7; color: #15803d; border: 1px solid #86efac; padding: 6px 10px; font-size: 0.8rem; }
        .btn-wa:hover { background: var(--whatsapp); color: white; }
        .btn-edit { background: var(--warning); color: white; padding: 6px 10px; font-size: 0.8rem; }
        .btn-delete { background: var(--danger); color: white; padding: 6px 10px; font-size: 0.8rem; }
        .btn-danger-dark { background: #991b1b; color: white; padding: 10px 14px; font-size: 0.85rem; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.88rem; }
        th, td { padding: 12px 10px; border-bottom: 1px solid var(--border); }
        th { background-color: #f8fafc; color: #475569; font-weight: 600; }
        
        .status-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
        }
        .status-paid { background: #dcfce7; color: #15803d; }
        .status-unpaid { background: #fee2e2; color: #b91c1c; }
        
        .pay-detail-info {
            font-size: 0.78rem;
            color: #64748b;
            margin-top: 4px;
            display: block;
        }

        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .modal-content h3 { margin: 0; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .modal-btn-group { display: flex; flex-direction: column; gap: 8px; }
    </style>
</head>
<body>

<div class="main-container">

    <div class="header-status-bar">
        <a href="index.html" class="btn-secondary" style="font-size: 0.85rem; padding: 6px 12px;">← Ana Menüye Dön</a>
        <div id="dbStatusBadge" class="db-status-badge db-offline">
            🔴 DB Bağlantısı Kesildi
        </div>
    </div>

    <!-- FORM ALANI -->
    <div class="card">
        <h2 id="formTitle">12 Aylık Harçlık Planı Oluştur / Düzenle</h2>
        <form id="harclikForm" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="editIndex" value="-1">

            <div class="form-grid">
                <div class="form-group">
                    <label for="userName">Kişi Seçin (Ayarlar DB)</label>
                    <select id="userName" required onchange="calculatePreviewDaily()">
                        <!-- Dinamik Yüklenecek -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="period">Başlangıç / İşlem Ayı</label>
                    <input type="month" id="period" required onchange="calculatePreviewDaily()">
                </div>

                <div class="form-group">
                    <label for="baseDaily">Mevcut / Yeni Günlük Ücret (₺)</label>
                    <input type="number" id="baseDaily" min="0" step="0.5" value="100" required oninput="calculatePreviewDaily()">
                </div>

                <div class="form-group">
                    <label for="raisePercent">Uygulanacak Zam Oranı (%)</label>
                    <input type="number" id="raisePercent" min="0" step="0.1" value="0" placeholder="Örn: 10" oninput="calculatePreviewDaily()">
                </div>

                <div class="form-group">
                    <label>Zamlı Günlük Ücret (₺)</label>
                    <input type="number" id="previewDaily" readonly style="background-color: #f1f5f9; font-weight: bold; color: #2563eb;">
                </div>

                <div class="form-group">
                    <label>📊 12 Aylık Ortalama Günlük Ücret (₺)</label>
                    <input type="number" id="avg12MonthDaily" readonly style="background-color: #ecfdf5; font-weight: bold; color: #059669; border: 1px solid #a7f3d0;">
                </div>

                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Haftalık Tatil Günleri</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="weeklyOff" value="1" onchange="calculatePreviewDaily()"> Pzt</label>
                        <label><input type="checkbox" name="weeklyOff" value="2" onchange="calculatePreviewDaily()"> Sal</label>
                        <label><input type="checkbox" name="weeklyOff" value="3" onchange="calculatePreviewDaily()"> Çar</label>
                        <label><input type="checkbox" name="weeklyOff" value="4" onchange="calculatePreviewDaily()"> Per</label>
                        <label><input type="checkbox" name="weeklyOff" value="5" onchange="calculatePreviewDaily()"> Cum</label>
                        <label><input type="checkbox" name="weeklyOff" value="6" checked onchange="calculatePreviewDaily()"> Cmt</label>
                        <label><input type="checkbox" name="weeklyOff" value="0" checked onchange="calculatePreviewDaily()"> Paz</label>
                    </div>
                </div>

                <div class="update-option" id="futureUpdateBox" style="display: none;">
                    <input type="checkbox" id="updateFutureMonths" checked>
                    <label for="updateFutureMonths">Bu ay yapılan zamlı ücreti bu ay ve SONRAKİ TÜM AYLARA sabit olarak yansıt</label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="submitBtn">12 Aylık Plan Oluştur / Güncelle</button>
                    <button type="button" class="btn-secondary" onclick="resetForm()">Temizle / İptal</button>
                </div>
            </div>
        </form>
    </div>

    <!-- KAYITLI VERİLER TABLOSU -->
    <div class="card">
        <h2>Harçlık Planı ve Ödeme Takip Listesi</h2>
        
        <div class="filter-bar">
            <label><strong>Filtrele (Kişi):</strong></label>
            <select id="filterUser" onchange="handleFilterChange()" style="padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border);">
                <option value="ALL">Tümü</option>
            </select>

            <button type="button" class="btn-delete" id="btnDeleteSelectedUser" onclick="deleteEntireUserFromFilter()" style="display: none; margin-left: auto;">
                🗑️ Seçili Kişinin TÜM Kayıtlarını Sil
            </button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Kişi</th>
                        <th>Dönem</th>
                        <th>Günlük Ücret</th>
                        <th>Ödenecek / Toplam Gün</th>
                        <th>Toplam Harçlık</th>
                        <th>Ödeme Durumu & Detayı</th>
                        <th>İşlemler</th>
                    </tr>
                </thead>
                <tbody id="recordsTableBody">
                    <!-- Dinamik Veriler -->
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- ÖDEME DETAY MODAL -->
<div class="modal" id="payModal">
    <div class="modal-content">
        <h3>Ödeme Detaylarını Girin</h3>
        
        <div class="form-group">
            <label for="payMethod">Ödeme Yöntemi</label>
            <select id="payMethod">
                <option value="Nakit">Nakit</option>
                <option value="EFT / Havale">EFT / Havale</option>
                <option value="FAST / Papara / Mobil">FAST / Papara / Mobil</option>
            </select>
        </div>

        <div class="form-group">
            <label for="payDateTime">Ödeme Tarihi ve Saati</label>
            <input type="datetime-local" id="payDateTime">
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px;">
            <button type="button" class="btn-secondary" onclick="closePayModal()">İptal</button>
            <button type="button" class="btn-primary" onclick="confirmPayment()">Ödemeyi Onayla</button>
        </div>
    </div>
</div>

<!-- GELİŞMİŞ SİLME MODAL -->
<div class="modal" id="deleteModal">
    <div class="modal-content">
        <h3>Silme İşlemi Seçenekleri</h3>
        <p id="deleteModalText" style="font-size:0.9rem; color:#475569; margin:0;">Silmek istediğiniz kapsamı seçin:</p>
        
        <div class="modal-btn-group">
            <button class="btn-delete" onclick="executeDelete('single')">
                🗑️ Sadece Bu Ayı Sil (<span id="delPeriodText"></span>)
            </button>
            <button class="btn-delete" style="background:#dc2626;" onclick="executeDelete('future')">
                ⏩ Bu Ay ve Sonraki Tüm Ayları Sil
            </button>
            <button class="btn-danger-dark" onclick="executeDelete('allUser')">
                ⚠️ <span id="delUserText"></span> Adlı Kişinin TÜM Kayıtlarını Sil
            </button>
        </div>

        <div style="display: flex; justify-content: flex-end; margin-top: 5px;">
            <button type="button" class="btn-secondary" onclick="closeDeleteModal()">İptal</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD1hbPbA81qldXCsQxSM4Ozxr9L8sdRTMk",
        authDomain: "karaaslanhomebutcetakip.firebaseapp.com",
        databaseURL: "https://karaaslanhomebutcetakip-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "karaaslanhomebutcetakip",
        storageBucket: "karaaslanhomebutcetakip.firebasestorage.app",
        messagingSenderId: "566343253682",
        appId: "1:566343253682:web:3ab14198fca800d69813ab"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let records = [];
    let activePayIndex = null;
    let activeDeleteIndex = null;

    // --- DB BAĞLANTI DURUMU TAKİBİ ---
    const dbStatusBadge = document.getElementById('dbStatusBadge');
    db.ref('.info/connected').on('value', (snap) => {
        if (snap.val() === true) {
            dbStatusBadge.className = "db-status-badge db-online";
            dbStatusBadge.innerHTML = "🟢 DB Bağlantısı Aktif";
        } else {
            dbStatusBadge.className = "db-status-badge db-offline";
            dbStatusBadge.innerHTML = "🔴 DB Bağlantısı Kesildi";
        }
    });

    // --- AYARLAR.HTML KULLANICILARINI CANLI ÇEKME ---
    db.ref('usersDB').on('value', (snapshot) => {
        const users = snapshot.val() || {};
        const userNameSelect = document.getElementById('userName');
        const filterUserSelect = document.getElementById('filterUser');

        const currentVal = userNameSelect.value;
        const currentFilter = filterUserSelect.value;

        userNameSelect.innerHTML = '';
        filterUserSelect.innerHTML = '<option value="ALL">Tümü</option>';

        Object.keys(users).forEach(u => {
            const opt1 = document.createElement('option');
            opt1.value = u;
            opt1.textContent = u;
            userNameSelect.appendChild(opt1);

            const opt2 = document.createElement('option');
            opt2.value = u;
            opt2.textContent = u;
            filterUserSelect.appendChild(opt2);
        });

        if (currentVal && users[currentVal]) userNameSelect.value = currentVal;
        if (currentFilter) filterUserSelect.value = currentFilter;

        calculatePreviewDaily();
    });

    // --- HARÇLIK KAYITLARINI FIREBASE'DEN CANLI DİNLEME ---
    db.ref('harclikDB').on('value', (snapshot) => {
        records = snapshot.val() || [];
        calculatePreviewDaily();
        renderTable();
    });

    // --- YÖNETİCİ ŞİFRE KONTROLÜ (DÜZENLE / SİL İÇİN) ---
    async function verifyAdminPin() {
        const pin = prompt("🔒 Lütfen işlemi onaylamak için Yönetici PIN Kodunu giriniz:");
        if (!pin) return false;

        const snapshot = await db.ref('usersDB').once('value');
        const users = snapshot.val() || {};
        
        const isMuratValid = users['murat'] && users['murat'].pin === pin.trim();
        const isAdminValid = users['admin'] && users['admin'].pin === pin.trim();

        if (isMuratValid || isAdminValid) {
            return true;
        } else {
            alert("❌ Hatalı Yönetici PIN Kodu! İşlem reddedildi.");
            return false;
        }
    }

    function calculatePreviewDaily() {
        const base = parseFloat(document.getElementById('baseDaily').value) || 0;
        const raise = parseFloat(document.getElementById('raisePercent').value) || 0;
        const finalRate = base * (1 + (raise / 100));
        document.getElementById('previewDaily').value = finalRate.toFixed(2);

        const userName = document.getElementById('userName').value;
        const startPeriod = document.getElementById('period').value;
        if (!startPeriod || !userName) return;

        let totalDailySum = 0;
        for (let i = 0; i < 12; i++) {
            const currentPeriod = addMonthsToPeriod(startPeriod, i);
            const existingRec = records.find(r => r.userName === userName && r.period === currentPeriod);
            const dailyForThisMonth = existingRec ? existingRec.dailyRate : finalRate;
            totalDailySum += dailyForThisMonth;
        }

        const avgDailyRate = totalDailySum / 12;
        document.getElementById('avg12MonthDaily').value = avgDailyRate.toFixed(2);
    }

    function getOfficialHolidayCount(year, month) {
        let count = 0;
        if (month === 1) count += 1;
        if (month === 4) count += 1;
        if (month === 5) count += 2;
        if (month === 7) count += 1;
        if (month === 8) count += 1;
        if (month === 10) count += 1;

        if (year === 2026 && month === 3) count += 3.5;
        if (year === 2026 && month === 5) count += 4.5;
        if (year === 2027 && month === 3) count += 3.5;
        if (year === 2027 && month === 5) count += 4.5;

        return count;
    }

    function addMonthsToPeriod(periodStr, monthsToAdd) {
        const [y, m] = periodStr.split('-').map(Number);
        const date = new Date(y, m - 1 + monthsToAdd, 1);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        return `${year}-${month}`;
    }

    window.onload = function() {
        document.getElementById('period').value = "2026-08";
        calculatePreviewDaily();
    };

    async function handleFormSubmit(event) {
        event.preventDefault();

        const editIndex = parseInt(document.getElementById('editIndex').value);
        if (editIndex !== -1) {
            const authorized = await verifyAdminPin();
            if (!authorized) return;
        }

        const userName = document.getElementById('userName').value;
        const startPeriod = document.getElementById('period').value;
        const baseDaily = parseFloat(document.getElementById('baseDaily').value) || 0;
        const raisePercent = parseFloat(document.getElementById('raisePercent').value) || 0;
        const targetDailyRate = baseDaily * (1 + (raisePercent / 100));
        const weeklyOff = Array.from(document.querySelectorAll('input[name="weeklyOff"]:checked')).map(cb => parseInt(cb.value));
        const updateFuture = document.getElementById('updateFutureMonths').checked;

        if (editIndex === -1) {
            for (let i = 0; i < 12; i++) {
                const currentPeriod = addMonthsToPeriod(startPeriod, i);
                const record = calculateMonthData(userName, currentPeriod, targetDailyRate, weeklyOff, false);
                
                const existingIdx = records.findIndex(r => r.userName === userName && r.period === currentPeriod);
                if (existingIdx > -1) {
                    records[existingIdx] = { ...record, isPaid: records[existingIdx].isPaid, paymentMethod: records[existingIdx].paymentMethod, paymentDate: records[existingIdx].paymentDate };
                } else {
                    records.push(record);
                }
            }
        } else {
            const targetRecord = records[editIndex];
            const updatedRecord = calculateMonthData(userName, startPeriod, targetDailyRate, weeklyOff, targetRecord.isPaid, targetRecord.paymentMethod, targetRecord.paymentDate);
            records[editIndex] = updatedRecord;

            if (updateFuture) {
                records.forEach((rec, idx) => {
                    if (rec.userName === userName && rec.period > startPeriod) {
                        records[idx] = calculateMonthData(userName, rec.period, targetDailyRate, weeklyOff, rec.isPaid, rec.paymentMethod, rec.paymentDate);
                    }
                });
            }
        }

        saveAndRefresh();
        resetForm();
    }

    function calculateMonthData(userName, period, dailyRate, weeklyOff, isPaid, paymentMethod = null, paymentDate = null) {
        const [year, month] = period.split('-').map(Number);
        const totalDays = new Date(year, month, 0).getDate();
        const officialHolidays = getOfficialHolidayCount(year, month);

        let weeklyOffCount = 0;
        for (let day = 1; day <= totalDays; day++) {
            const dayOfWeek = new Date(year, month - 1, day).getDay();
            if (weeklyOff.includes(dayOfWeek)) {
                weeklyOffCount++;
            }
        }

        const payableDays = Math.max(0, totalDays - weeklyOffCount - officialHolidays);
        const totalAmount = payableDays * dailyRate;

        return {
            userName, period, dailyRate, weeklyOff,
            totalDays, payableDays, officialHolidays, totalAmount,
            isPaid: isPaid || false,
            paymentMethod: paymentMethod || null,
            paymentDate: paymentDate || null
        };
    }

    function handleFilterChange() {
        const filterUser = document.getElementById('filterUser').value;
        const deleteBtn = document.getElementById('btnDeleteSelectedUser');
        
        if (filterUser !== 'ALL') {
            deleteBtn.style.display = 'inline-flex';
            deleteBtn.innerText = `🗑️ ${filterUser} - Tüm Kayıtlarını Sil`;
        } else {
            deleteBtn.style.display = 'none';
        }
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('recordsTableBody');
        const filterUser = document.getElementById('filterUser').value;
        tbody.innerHTML = '';

        records.sort((a, b) => a.period.localeCompare(b.period));
        const filteredRecords = records.filter(r => filterUser === 'ALL' || r.userName === filterUser);

        if (filteredRecords.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#94a3b8;">Henüz kaydedilmiş veri bulunmuyor.</td></tr>`;
            return;
        }

        filteredRecords.forEach((rec) => {
            const actualIndex = records.indexOf(rec);
            const tr = document.createElement('tr');
            
            let statusHtml = '';
            let payButton = '';

            if (rec.isPaid) {
                const formattedDate = rec.paymentDate ? formatDateTime(rec.paymentDate) : '';
                statusHtml = `
                    <span class="status-badge status-paid">ÖDENDİ</span>
                    <span class="pay-detail-info">💳 ${rec.paymentMethod || 'Belirtilmedi'}</span>
                    <span class="pay-detail-info">🕒 ${formattedDate}</span>
                `;
                payButton = `<button class="btn-paid-cancel" onclick="cancelPayment(${actualIndex})" title="Ödendi durumunu iptal et">İptal Et</button>`;
            } else {
                statusHtml = `<span class="status-badge status-unpaid">ÖDENMEDİ</span>`;
                payButton = `<button class="btn-pay" onclick="openPayModal(${actualIndex})">Öde</button>`;
            }

            tr.innerHTML = `
                <td><strong>${rec.userName}</strong></td>
                <td><span style="background:#e2e8f0; padding:2px 6px; border-radius:4px; font-weight:600;">${rec.period}</span></td>
                <td><strong>${rec.dailyRate.toFixed(2)} ₺</strong></td>
                <td><strong>${rec.payableDays}</strong> / ${rec.totalDays} Gün</td>
                <td style="font-weight:bold; color:#059669;">${rec.totalAmount.toFixed(2)} ₺</td>
                <td>${statusHtml}</td>
                <td style="display:flex; gap:4px; flex-wrap:wrap;">
                    ${payButton}
                    <button class="btn-wa" onclick="sendWhatsApp(${actualIndex})" title="WhatsApp ile Gönder">💬 WA</button>
                    <button class="btn-edit" onclick="editRecord(${actualIndex})">Düzenle</button>
                    <button class="btn-delete" onclick="openDeleteModal(${actualIndex})">Sil</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function openDeleteModal(index) {
        activeDeleteIndex = index;
        const rec = records[index];
        document.getElementById('delPeriodText').innerText = rec.period;
        document.getElementById('delUserText').innerText = rec.userName;
        document.getElementById('deleteModalText').innerText = `${rec.userName} kişisine ait ${rec.period} kaydı için yapılacak silme türünü seçin:`;
        document.getElementById('deleteModal').style.display = 'flex';
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').style.display = 'none';
        activeDeleteIndex = null;
    }

    async function executeDelete(type) {
        if (activeDeleteIndex === null) return;

        const authorized = await verifyAdminPin();
        if (!authorized) return;

        const targetRec = records[activeDeleteIndex];

        if (type === 'single') {
            records.splice(activeDeleteIndex, 1);
        } else if (type === 'future') {
            records = records.filter(r => !(r.userName === targetRec.userName && r.period >= targetRec.period));
        } else if (type === 'allUser') {
            records = records.filter(r => r.userName !== targetRec.userName);
        }

        closeDeleteModal();
        saveAndRefresh();
    }

    async function deleteEntireUserFromFilter() {
        const selectedUser = document.getElementById('filterUser').value;
        if (selectedUser === 'ALL') return;

        const authorized = await verifyAdminPin();
        if (!authorized) return;

        records = records.filter(r => r.userName !== selectedUser);
        document.getElementById('filterUser').value = 'ALL';
        handleFilterChange();
        saveAndRefresh();
    }

    function openPayModal(index) {
        activePayIndex = index;
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('payDateTime').value = now.toISOString().slice(0, 16);
        document.getElementById('payModal').style.display = 'flex';
    }

    function closePayModal() {
        document.getElementById('payModal').style.display = 'none';
        activePayIndex = null;
    }

    function confirmPayment() {
        if (activePayIndex === null) return;
        const method = document.getElementById('payMethod').value;
        const dateTime = document.getElementById('payDateTime').value;

        records[activePayIndex].isPaid = true;
        records[activePayIndex].paymentMethod = method;
        records[activePayIndex].paymentDate = dateTime;

        closePayModal();
        saveAndRefresh();
    }

    function cancelPayment(index) {
        if (confirm("Bu ödemenin onayını iptal etmek istediğinizden emin misiniz?")) {
            records[index].isPaid = false;
            records[index].paymentMethod = null;
            records[index].paymentDate = null;
            saveAndRefresh();
        }
    }

    function formatDateTime(isoString) {
        if (!isoString) return '';
        const d = new Date(isoString);
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    function sendWhatsApp(index) {
        const rec = records[index];
        let statusMessage = "";

        if (rec.isPaid) {
            const formattedDate = formatDateTime(rec.paymentDate);
            statusMessage = `*Ödeme Detayı:* ${formattedDate} tarihinde *${rec.paymentMethod}* yöntemi ile hesabına yatırılmıştır. ✅`;
        } else {
            statusMessage = `*Ödeme Durumu:* Henüz ödenmemiştir. ⏳`;
        }

        const message = `Merhaba ${rec.userName},\n\n*${rec.period}* dönemi harçlık detayların:\n- Ödenecek Gün: ${rec.payableDays} Gün\n- Günlük Harçlık: ${rec.dailyRate.toFixed(2)} ₺\n- *Toplam Tutar: ${rec.totalAmount.toFixed(2)} ₺*\n\n${statusMessage}\n\nGüle güle harca! 💸`;

        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
        window.open(waUrl, '_blank');
    }

    function editRecord(index) {
        const rec = records[index];
        
        document.getElementById('editIndex').value = index;
        document.getElementById('userName').value = rec.userName;
        document.getElementById('period').value = rec.period;
        document.getElementById('baseDaily').value = rec.dailyRate;
        document.getElementById('raisePercent').value = 0;

        document.querySelectorAll('input[name="weeklyOff"]').forEach(cb => {
            cb.checked = rec.weeklyOff.includes(parseInt(cb.value));
        });

        document.getElementById('formTitle').innerText = `${rec.userName} - ${rec.period} Ayı Zam / Güncelleme`;
        document.getElementById('submitBtn').innerText = "Değişiklikleri Kaydet";
        document.getElementById('futureUpdateBox').style.display = "flex";

        calculatePreviewDaily();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('harclikForm').reset();
        document.getElementById('editIndex').value = "-1";
        document.getElementById('formTitle').innerText = "12 Aylık Harçlık Planı Oluştur / Düzenle";
        document.getElementById('submitBtn').innerText = "12 Aylık Plan Oluştur / Güncelle";
        document.getElementById('futureUpdateBox').style.display = "none";
        
        document.querySelectorAll('input[name="weeklyOff"]').forEach(cb => {
            cb.checked = (cb.value === "0" || cb.value === "6");
        });
        document.getElementById('period').value = "2026-08";
        calculatePreviewDaily();
    }

    function saveAndRefresh() {
        db.ref('harclikDB').set(records);
    }
</script>

</body>
</html>
