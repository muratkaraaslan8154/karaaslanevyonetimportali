<script>
        const firebaseConfig = {
            apiKey: "AIzaSyD1hbPbA81qldXCsQxSM4Ozxr9L8sdRTMk",
            authDomain: "karaaslanhomebutcetakip.firebaseapp.com",
            databaseURL: "https://karaaslanhomebutcetakip-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "karaaslanhomebutcetakip",
            storageBucket: "karaaslanhomebutcetakip.firebasestorage.app",
            messagingSenderId: "566343253682",
            appId: "1:566343253682:web:3ab14198fca800d69813ab"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const activeUser = (localStorage.getItem('currentUser') || '').toLowerCase();

        // Admin ve Murat için gizli menüleri açma
        if (activeUser === 'murat' || activeUser === 'admin') {
            document.getElementById('saglik-menu-section').style.display = 'block';
            document.getElementById('admin-menu-section').style.display = 'block';
            document.getElementById('finans-ozel-section').style.display = 'block';
            document.getElementById('uygulama-portali-section').style.display = 'block';
        }

        // Anlık Bloklanma VE Cihaz Silinme Kontrolü
        if (activeUser) {
            db.ref('usersDB/' + activeUser).on('value', (snapshot) => {
                const userData = snapshot.val();
                if (!userData) return;

                // 1. Genel Bloke Kontrolü
                if (userData.isBlocked === true) {
                    alert("🚫 Hesabınız yönetici tarafından bloke edilmiştir! Oturum kapatılıyor.");
                    
                    // YENİ: Sadece oturumu kapat, Cihaz ID'yi silme!
                    localStorage.removeItem('isLoggedIn');
                    localStorage.removeItem('currentUser');
                    sessionStorage.clear();
                    
                    window.location.replace('giris.html');
                    return;
                }

                // 2. Anlık Cihaz İzni Kontrolü
                const isExempt = (activeUser === 'murat' || activeUser === 'admin');
                if (!isExempt) {
                    const currentDeviceId = localStorage.getItem('app_device_id');
                    const isMainDevice = (userData.registeredDevice === currentDeviceId);
                    const isSafeDevice = (userData.safeDevices && userData.safeDevices[currentDeviceId]);
                    
                    if (userData.registeredDevice && !isMainDevice && !isSafeDevice) {
                        alert("📱 Bu cihazın sisteme erişim izni yönetici tarafından iptal edilmiştir! Güvenlik sebebiyle oturum kapatılıyor.");
                        
                        // YENİ: Sadece oturumu kapat, Cihaz ID'yi silme!
                        localStorage.removeItem('isLoggedIn');
                        localStorage.removeItem('currentUser');
                        sessionStorage.clear();
                        
                        window.location.replace('giris.html');
                    }
                }
            });
        }

        async function cikisYap() {
            const devId = localStorage.getItem('app_device_id') || 'Bilinmeyen Cihaz';
            const now = new Date();
            const timeStr = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR');
            
            try {
                await db.ref('systemLogs').push({
                    user: activeUser || 'Bilinmeyen',
                    action: "Çıkış Yapıldı",
                    time: timeStr,
                    device: devId,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            } catch(e) {}

            // YENİ: Sadece oturumu kapat, Cihaz ID'yi silme!
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('currentUser');
            sessionStorage.clear();
            
            // Cookie'yi temizle
            document.cookie = "currentUser=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";

            window.location.href = 'giris.html';
        }
    </script>
