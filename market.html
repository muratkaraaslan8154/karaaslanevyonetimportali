<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaaslan Home - Harcama Girişi</title>
    
    <!-- MOBİL UYUMLU OTURUM OKUYUCU -->
    <script>
        function aktifKullaniciBul() {
            const urlParams = new URLSearchParams(window.location.search);
            let user = urlParams.get('user');

            if (!user) user = localStorage.getItem('currentUser');
            if (!user) user = sessionStorage.getItem('currentUser');
            if (!user) {
                const match = document.cookie.match(new RegExp('(^| )currentUser=([^;]+)'));
                if (match) user = match[2];
            }

            if (user) {
                localStorage.setItem('currentUser', user);
                localStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('currentUser', user);
            }
            return user;
        }

        const aktifUser = aktifKullaniciBul();
        if (!aktifUser) {
            window.location.replace('giris.html');
        }
    </script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --bg: #f4f6f9; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); margin: 0; padding: 15px; color: #333; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; }
        .btn-back { background-color: var(--primary); color: white; text-decoration: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; }
        .user-badge { background-color: #e2e8f0; color: #2d3748; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; text-transform: capitalize; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin-top: 0; color: var(--primary); font-size: 1.2rem; text-align: center; }
        
        /* Dynamic Kasa Bilgi Kutusu */
        .kasa-bilgi { background: #eef2f7; color: #2c3e50; padding: 12px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 15px; border: 1px solid #cbd5e1; font-size: 0.95rem; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
        .btn-submit { background-color: var(--secondary); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        #karma-alan { background: #e8f8f5; border: 2px solid #27ae60; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .ozet-kutusu { font-size: 0.85rem; background: #fff; padding: 10px; border-radius: 6px; border: 1px dashed #27ae60; margin-top: 10px; }
        .ozet-satir { margin-bottom: 4px; font-weight: 600; }
        .alert { display: none; padding: 12px; background: #d4efdf; color: #155724; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a id="back-link" href="index.html" class="btn-back">⬅️ Ana Menüye Dön</a>
        <div class="user-badge" id="kullanici-etiket">👤 ...</div>
    </div>

    <div class="card">
        <h2>🛍️ Pazar & Market Harcama / Fiş Ekle</h2>
        
        <!-- Canlı Kasa Miktarı Kutusu -->
        <div class="kasa-bilgi" id="kasa-bilgi">💵 Kasa Bakiyesi Yükleniyor...</div>

        <div id="basari-mesaji" class="alert">Harcama Başarıyla Kaydedildi! ✅</div>
        
        <form id="harcama-form">
            <div class="form-group">
                <label>Tarih</label>
                <input type="date" id="harcama-tarihi" required>
            </div>

            <div class="form-group">
                <label>Kategori</label>
                <select id="kategori" onchange="kategoriDegisti()">
                    <option value="Market">Market</option>
                    <option value="Pazar">Pazar</option>
                    <option value="Karma">🧠 Karma (Market + Sebze/Pazar)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fiş / Fatura Fotoğrafı</label>
                <input type="file" id="fis-resmi" accept="image/*" onchange="resimiHazirla(event)">
            </div>

            <div class="form-group">
                <label>Açıklama / Not</label>
                <input type="text" id="harcama-aciklama" placeholder="Örn: Bakkal, Fırın vs.">
            </div>

            <div id="tekli-alan">
                <div class="form-group">
                    <label>Toplam Tutar (TL)</label>
                    <input type="number" id="toplam-tutar" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label>Kasadan Ödenen Nakit (TL)</label>
                    <input type="number" id="nakit-odenen" step="0.01" min="0">
                </div>
            </div>

            <div id="karma-alan" style="display: none;">
                <div class="form-group">
                    <label>Fişin GENEL Toplamı (TL)</label>
                    <input type="number" id="k-genel-toplam" step="0.01" min="0" oninput="karmaHesapla()">
                </div>
                <div class="form-group">
                    <label>Sebze / Meyve (PAZAR) Tutarı (TL)</label>
                    <input type="number" id="k-pazar-tutar" step="0.01" min="0" oninput="karmaHesapla()">
                </div>
                <div class="form-group">
                    <label>Ödenen Toplam NAKİT (TL)</label>
                    <input type="number" id="k-genel-nakit" step="0.01" min="0" oninput="karmaHesapla()">
                </div>

                <div class="ozet-kutusu">
                    <div class="ozet-satir" id="pazar-ozet" style="color: #27ae60;">🥬 Pazar: 0 TL (0 TL Nakit, 0 TL KK)</div>
                    <div class="ozet-satir" id="market-ozet" style="color: #2c3e50;">🛒 Market: 0 TL (0 TL Nakit, 0 TL KK)</div>
                </div>
            </div>

            <button type="submit" class="btn-submit" style="margin-top: 15px;">Kaydet</button>
        </form>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD1hbPbA81qldXCsQxSM4Ozxr9L8sdRTMk",
            authDomain: "karaaslanhomebutcetakip.firebaseapp.com",
            databaseURL: "https://karaaslanhomebutcetakip-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "karaaslanhomebutcetakip",
            storageBucket: "karaaslanhomebutcetakip.firebasestorage.app",
            messagingSenderId: "566343253682",
            appId: "1:566343253682:web:c32d2821f65dcf2b9813ab"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let mevcutResimBase64 = "";
        let marketKasaNakit = 0;
        let pazarKasaNakit = 0;

        window.onload = () => {
            tarihiGuncelle();
            kasaMiktarlariniTakipEt();
            
            const user = aktifKullaniciBul();
            if (user) {
                const formatli = user.charAt(0).toUpperCase() + user.slice(1);
                document.getElementById('kullanici-etiket').innerText = '👤 ' + formatli;
                document.getElementById('back-link').href = `index.html?user=${encodeURIComponent(user)}`;
            }
        };

        // Firebase'den Market ve Pazar Kasasını Dinleme
        function kasaMiktarlariniTakipEt() {
            db.ref().on('value', (snapshot) => {
                const rootData = snapshot.val() || {};
                
                // Farklı Firebase yapılarına uyumlu okuma
                const kasaData = rootData.kasa || rootData.kasalar || {};
                
                marketKasaNakit = parseFloat(
                    (kasaData.market && kasaData.market.sayilan) || 
                    kasaData.marketNakit || 
                    kasaData.market || 
                    1454.00
                ) || 0;

                pazarKasaNakit = parseFloat(
                    (kasaData.pazar && kasaData.pazar.sayilan) || 
                    kasaData.pazarNakit || 
                    kasaData.pazar || 
                    1678.00
                ) || 0;

                kasaEkraniGuncelle();
            });
        }

        function kasaEkraniGuncelle() {
            const kat = document.getElementById('kategori').value;
            const bilgiKutusu = document.getElementById('kasa-bilgi');
            
            if (kat === 'Market') {
                bilgiKutusu.innerText = `🛒 Market Kasasındaki Nakit: ${marketKasaNakit.toFixed(2)} TL`;
            } else if (kat === 'Pazar') {
                bilgiKutusu.innerText = `🥬 Pazar Kasasındaki Nakit: ${pazarKasaNakit.toFixed(2)} TL`;
            } else if (kat === 'Karma') {
                bilgiKutusu.innerText = `🛒 Market: ${marketKasaNakit.toFixed(2)} TL | 🥬 Pazar: ${pazarKasaNakit.toFixed(2)} TL`;
            }
        }

        function tarihiGuncelle() {
            document.getElementById('harcama-tarihi').value = new Date().toISOString().split('T')[0];
        }

        function kategoriDegisti() {
            const kat = document.getElementById('kategori').value;
            document.getElementById('tekli-alan').style.display = kat === 'Karma' ? 'none' : 'block';
            document.getElementById('karma-alan').style.display = kat === 'Karma' ? 'block' : 'none';
            kasaEkraniGuncelle();
        }

        function resimiHazirla(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let scale = 600 / img.width;
                        if(scale > 1) scale = 1;
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        mevcutResimBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    }
                    img.src = evt.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function karmaHesapla() {
            const gTop = parseFloat(document.getElementById('k-genel-toplam').value) || 0;
            const pTop = parseFloat(document.getElementById('k-pazar-tutar').value) || 0;
            const gNak = parseFloat(document.getElementById('k-genel-nakit').value) || 0;

            const mTop = Math.max(0, gTop - pTop);
            const pNak = Math.min(pTop, gNak);
            const pKK = Math.max(0, pTop - pNak);
            const mNak = Math.max(0, gNak - pNak);
            const mKK = Math.max(0, mTop - mNak);

            document.getElementById('pazar-ozet').innerText = `🥬 Pazar: ${pTop.toFixed(2)} TL (${pNak.toFixed(2)} TL Nakit, ${pKK.toFixed(2)} TL KK)`;
            document.getElementById('market-ozet').innerText = `🛒 Market: ${mTop.toFixed(2)} TL (${mNak.toFixed(2)} TL Nakit, ${mKK.toFixed(2)} TL KK)`;

            return { pTop, pNak, pKK, mTop, mNak, mKK };
        }

        document.getElementById('harcama-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const tarih = document.getElementById('harcama-tarihi').value;
            const kat = document.getElementById('kategori').value;
            const aciklama = document.getElementById('harcama-aciklama').value.trim();
            const ekleyenUser = aktifKullaniciBul();

            if (!ekleyenUser) {
                alert("Oturum süreniz doldu. Lütfen tekrar giriş yapın.");
                window.location.replace('giris.html');
                return;
            }

            // Seçilen kategoriye göre ilgili kasa limitini kontrol etme
            let harcananMarketNakit = 0;
            let harcananPazarNakit = 0;

            if (kat === 'Market') {
                harcananMarketNakit = parseFloat(document.getElementById('nakit-odenen').value) || 0;
            } else if (kat === 'Pazar') {
                harcananPazarNakit = parseFloat(document.getElementById('nakit-odenen').value) || 0;
            } else if (kat === 'Karma') {
                const guncel = karmaHesapla();
                harcananMarketNakit = guncel.mNak;
                harcananPazarNakit = guncel.pNak;
            }

            // Nakit Aşım Kontrolü ve Uyarısı
            let asimMesaji = "";
            if (harcananMarketNakit > marketKasaNakit) {
                asimMesaji += `• Market Kasasındaki Nakit Aşıldı! (Kasada: ${marketKasaNakit.toFixed(2)} TL / Ödenen: ${harcananMarketNakit.toFixed(2)} TL)\n`;
            }
            if (harcananPazarNakit > pazarKasaNakit) {
                asimMesaji += `• Pazar Kasasındaki Nakit Aşıldı! (Kasada: ${pazarKasaNakit.toFixed(2)} TL / Ödenen: ${harcananPazarNakit.toFixed(2)} TL)\n`;
            }

            if (asimMesaji !== "") {
                const onay = confirm(`⚠️ UYARI: KASA BAKİYESİNİ AŞIYORSUNUZ!\n\n${asimMesaji}\nYine de kaydetmek istiyor musunuz?`);
                if (!onay) return;
            }

            const simdi = new Date();
            const eklemeSaati = String(simdi.getHours()).padStart(2, '0') + ':' + String(simdi.getMinutes()).padStart(2, '0');

            if (kat === 'Karma') {
                const guncel = karmaHesapla();
                const gTop = parseFloat(document.getElementById('k-genel-toplam').value) || 0;

                if (gTop <= 0) return alert("Lütfen geçerli bir Genel Toplam girin!");

                if (guncel.pTop > 0) {
                    db.ref('harcamalar').push({ tarih, kategori: 'Pazar', aciklama, resim: mevcutResimBase64, toplam: guncel.pTop, nakit: guncel.pNak, kk: guncel.pKK, ekleyen: ekleyenUser, saat: eklemeSaati });
                }
                if (guncel.mTop > 0) {
                    db.ref('harcamalar').push({ tarih, kategori: 'Market', aciklama, resim: mevcutResimBase64, toplam: guncel.mTop, nakit: guncel.mNak, kk: guncel.mKK, ekleyen: ekleyenUser, saat: eklemeSaati });
                }
            } else {
                const toplam = parseFloat(document.getElementById('toplam-tutar').value) || 0;
                const nakit = parseFloat(document.getElementById('nakit-odenen').value) || 0;

                if (toplam <= 0) return alert("Lütfen geçerli bir Toplam Tutar girin!");

                db.ref('harcamalar').push({ tarih, kategori: kat, aciklama, resim: mevcutResimBase64, toplam, nakit, kk: Math.max(0, toplam - nakit), ekleyen: ekleyenUser, saat: eklemeSaati });
            }

            const alertBox = document.getElementById('basari-mesaji');
            alertBox.style.display = 'block';
            setTimeout(() => alertBox.style.display = 'none', 3000);

            formuSifirla();
        });

        function formuSifirla() {
            document.getElementById('harcama-form').reset();
            mevcutResimBase64 = "";
            tarihiGuncelle();
            kategoriDegisti();
        }
    </script>
</body>
</html>
